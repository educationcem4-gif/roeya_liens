<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>مؤسسة التربية و التعليم رؤية سكول | مواقع التواصل الاجتماعي</title>
<meta name="description" content="تابعوا مؤسسة التربية و التعليم رؤية سكول على مواقع التواصل الاجتماعي">
<meta name="theme-color" content="#C81E2C">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%93%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --red-deep:#7A0C18;
    --red:#C81E2C;
    --red-bright:#E13C33;
    --gold:#F2B705;
    --gold-soft:#F6D776;
    --ink:#2B2118;
    --paper:#FFFDF9;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:100%;overflow-x:hidden;}
  body{
    font-family:'Cairo',sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .page{
    width:100%;
    max-width:460px;
    min-height:100vh;
    background:var(--paper);
    position:relative;
    display:flex;
    flex-direction:column;
  }
  .hero{
    position:relative;
    height:190px;
    background:var(--gold);
    overflow:hidden;
    flex:0 0 auto;
  }
  .hero::after{
    content:"";
    position:absolute;left:-10%;right:-10%;bottom:-1px;height:40px;
    background:var(--paper);
    border-radius:50% 50% 0 0 / 100% 100% 0 0;
  }
  .logo-card{
    position:absolute;
    left:50%;
    top:76px;
    transform:translateX(-50%);
    width:220px;
    max-width:70%;
    background:#fff;
    border-radius:28px;
    box-shadow:0 14px 32px rgba(122,12,24,0.22), 0 2px 6px rgba(0,0,0,0.08);
    padding:14px 12px 10px;
    z-index:3;
  }
  .logo-card img{display:block;width:100%;height:auto;}
  main{
    padding:118px 24px 8px;
    text-align:center;
    flex:1;
    width:100%;
  }
  h1{
    font-size:1.42rem;
    font-weight:800;
    line-height:1.55;
    color:var(--red-deep);
    overflow-wrap:break-word;
    word-break:break-word;
    max-width:100%;
  }
  .subtitle{
    margin-top:10px;
    font-size:1rem;
    font-weight:600;
    color:#9a7a1f;
    letter-spacing:.2px;
  }
  .divider{
    width:64px;height:4px;border-radius:4px;
    background:linear-gradient(90deg,var(--gold),var(--red));
    margin:24px auto 26px;
  }
  .links{
    display:flex;
    flex-direction:column;
    gap:14px;
    width:100%;
  }
  .link-btn{
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    max-width:100%;
    background:#fff;
    border:1.5px solid #f1e3d3;
    border-radius:18px;
    padding:14px 16px;
    text-decoration:none;
    color:var(--ink);
    box-shadow:0 4px 14px rgba(43,33,24,0.06);
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .link-btn:active{transform:scale(.97);}
  .icon-badge{
    flex:0 0 auto;
    width:48px;height:48px;
    border-radius:14px;
    display:flex;align-items:center;justify-content:center;
  }
  .icon-badge svg{width:24px;height:24px;}
  .fb .icon-badge{background:#1877F2;}
  .tt .icon-badge{background:#111111;}
  .link-text{flex:1;min-width:0;text-align:right;}
  .link-text .name{font-weight:800;font-size:1.02rem;display:block;}
  .link-text .desc{font-size:.8rem;color:#9a8a73;margin-top:2px;display:block;}
  .chevron{flex:0 0 auto;color:var(--gold);}
  .fb:hover{border-color:#1877F2;}
  .tt:hover{border-color:#111111;}
  a.link-btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px;}
  footer{
    text-align:center;
    padding:28px 20px 32px;
    font-size:.78rem;
    color:#b3a48f;
  }
  footer .tagline{
    display:block;
    margin-top:4px;
    color:var(--gold);
    font-weight:800;
    font-size:.85rem;
  }
  @media (min-width:461px){
    body{background:#f3ead9;padding:28px 12px;}
    .page{border-radius:26px;overflow:hidden;min-height:auto;box-shadow:0 24px 60px rgba(122,12,24,0.18);}
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;animation:none !important;}
  }
</style>
</head>
